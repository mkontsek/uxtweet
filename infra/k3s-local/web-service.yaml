apiVersion: v1
kind: Service
metadata:
    name: uxtweet-web
    namespace: uxtweet
    labels:
        app: uxtweet-web
spec:
    selector:
        app: uxtweet-web
    ports:
        # Service stays on :80 (the ingress targets it); the unprivileged nginx
        # container listens on 8080.
        - port: 80
          targetPort: 8080
          protocol: TCP
    type: ClusterIP
