apiVersion: v1
kind: Service
metadata:
    name: uxtweet-postgres
    namespace: uxtweet
    labels:
        app: uxtweet-postgres
spec:
    selector:
        app: uxtweet-postgres
    ports:
        - port: 5432
          targetPort: 5432
          protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
    name: uxtweet-postgres
    namespace: uxtweet
    labels:
        app: uxtweet-postgres
spec:
    serviceName: uxtweet-postgres
    replicas: 1
    selector:
        matchLabels:
            app: uxtweet-postgres
    template:
        metadata:
            labels:
                app: uxtweet-postgres
        spec:
            # PoC data tier: apply the safe, startup-agnostic hardening (default
            # seccomp, no privilege escalation). Full non-root / read-only-rootfs
            # hardening is deferred — see wiki Decisions (PoC limitation).
            securityContext:
                seccompProfile:
                    type: RuntimeDefault
            containers:
                - name: postgres
                  image: postgres:18.4-alpine
                  securityContext:
                      allowPrivilegeEscalation: false
                  ports:
                      - containerPort: 5432
                        protocol: TCP
                  env:
                      - name: POSTGRES_HOST_AUTH_METHOD
                        value: trust
                      - name: POSTGRES_USER
                        value: postgres
                      - name: POSTGRES_DB
                        value: uxtweet
                      - name: PGDATA
                        value: /var/lib/postgresql/data/pgdata
                  volumeMounts:
                      - name: postgres-data
                        mountPath: /var/lib/postgresql/data
                  readinessProbe:
                      tcpSocket:
                          port: 5432
                      initialDelaySeconds: 5
                      periodSeconds: 5
                  livenessProbe:
                      tcpSocket:
                          port: 5432
                      initialDelaySeconds: 30
                      periodSeconds: 10
                  resources:
                      requests:
                          cpu: 100m
                          memory: 256Mi
                      limits:
                          cpu: 500m
                          memory: 512Mi
    volumeClaimTemplates:
        - metadata:
              name: postgres-data
          spec:
              accessModes: ['ReadWriteOnce']
              resources:
                  requests:
                      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
    name: uxtweet-redis
    namespace: uxtweet
    labels:
        app: uxtweet-redis
spec:
    selector:
        app: uxtweet-redis
    ports:
        - port: 6379
          targetPort: 6379
          protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
    name: uxtweet-redis
    namespace: uxtweet
    labels:
        app: uxtweet-redis
spec:
    replicas: 1
    selector:
        matchLabels:
            app: uxtweet-redis
    template:
        metadata:
            labels:
                app: uxtweet-redis
        spec:
            securityContext:
                seccompProfile:
                    type: RuntimeDefault
            containers:
                - name: redis
                  image: redis:8.8.0-alpine
                  securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                          drop: ['ALL']
                  command:
                      - redis-server
                      - --appendonly
                      - 'no'
                      - --save
                      - ''
                      - --protected-mode
                      - 'no'
                  ports:
                      - containerPort: 6379
                        protocol: TCP
                  readinessProbe:
                      tcpSocket:
                          port: 6379
                      initialDelaySeconds: 3
                      periodSeconds: 5
                  livenessProbe:
                      tcpSocket:
                          port: 6379
                      initialDelaySeconds: 10
                      periodSeconds: 10
                  resources:
                      requests:
                          cpu: 50m
                          memory: 64Mi
                      limits:
                          cpu: 200m
                          memory: 256Mi
