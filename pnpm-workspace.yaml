packages:
    - 'apps/*'
    - 'packages/*'
    - 'e2e'

# Supply-chain hardening: never install a package version published less than
# 7 days (10080 minutes) ago, giving time for malicious releases to be caught
# and yanked. Requires pnpm >= 10.16.
minimumReleaseAge: 10080

# Allowlist of dependencies permitted to run install/build lifecycle scripts.
# pnpm blocks these by default; the ones below are vetted and required
# (esbuild fetches its native binary, vue-demi selects the Vue version,
# @parcel/watcher builds the file-watcher native addon).
allowBuilds:
    '@parcel/watcher': true
    esbuild: true
    vue-demi: true
