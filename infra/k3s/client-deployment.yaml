apiVersion: apps/v1
kind: Deployment
metadata:
  name: uxtweet-client
  namespace: uxtweet
  labels:
    app: uxtweet-client
spec:
  replicas: 2
  selector:
    matchLabels:
      app: uxtweet-client
  template:
    metadata:
      labels:
        app: uxtweet-client
    spec:
      containers:
        - name: client
          image: ghcr.io/mkontsek/uxtweet/client:latest
          ports:
            - containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
